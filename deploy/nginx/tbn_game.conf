# nginx site for tbn-game.filhmar.online on the shared VPS, beside the other apps' site files.
# docs/vps_setup.md installs it. Do not edit the other site files on that host.
#
# HTTP only on purpose: `certbot --nginx -d tbn-game.filhmar.online` rewrites this file in place,
# adding `listen 443 ssl`, the certificate lines and the port 80 redirect around these locations.
# nginx refuses a `listen ... ssl` block without a certificate, so shipping one would deadlock the
# first issuance.
#
# Everything goes to the one web process: it serves the client under /app, the API on its own
# paths and the Socket.IO gateway. The worker, the database and the rest of the stack publish
# nothing this file reaches.
#
# The credential gate. The client sends its session as `Authorization: Bearer`, so plain basic
# auth would refuse every API call once the owner signs in: a request carries one Authorization
# header. Basic auth therefore guards the first visit, and a request that passed it gets the gate
# cookie; a request that carries the cookie skips basic auth and reaches the app's own sign in.
# The gate token and the password file live only on the host, never in this public repository:
#   /etc/nginx/tbn_game_gate.conf    maps $cookie_tbn_gate and defines $tbn_gate_token; the token
#                                    is 32 hex characters, since a longer map key overflows nginx's
#                                    default map_hash_bucket_size and fails `nginx -t`
#   /etc/nginx/tbn_game.htpasswd     the username and its apr1 password hash
# ponytail: one shared gate token for every browser; rotate it by rewriting the gate file. A login
# portal (oauth2-proxy, Authelia) is the upgrade if more than the owner ever needs a gate.

include /etc/nginx/tbn_game_gate.conf;

upstream tbn_game_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

# Socket.IO upgrades to a WebSocket; every other request keeps the upstream connection alive.
map $http_upgrade $tbn_game_connection {
    default upgrade;
    ''      '';
}

# Set the gate cookie only on a request that passed basic auth, so a cookie request never
# re-sends it and a refused one never sees it.
map $remote_user $tbn_game_gate_cookie {
    ''      '';
    default "tbn_gate=$tbn_gate_token; Path=/; Max-Age=604800; Secure; HttpOnly; SameSite=Strict";
}

server {
    server_name tbn-game.filhmar.online;

    # The web process accepts 1 MB bodies (HTTP_BODY_LIMIT_BYTES); this leaves room for headers.
    client_max_body_size 2m;

    auth_basic $tbn_gate_realm;
    auth_basic_user_file /etc/nginx/tbn_game.htpasswd;
    add_header Set-Cookie $tbn_game_gate_cookie;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $tbn_game_connection;

    # The ACME http-01 challenge passes without credentials, for the first certificate and every
    # renewal.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # The web process's Prometheus metrics are for the stack's own Prometheus, never the internet.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://tbn_game_web;
    }
}
