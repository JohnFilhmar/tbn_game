# nginx site for tbn-game.filhmar.online on the shared VPS, beside the other apps' site files.
# docs/vps_setup.md installs it. Do not edit the other site files on that host.
#
# HTTP only on purpose: `certbot --nginx -d tbn-game.filhmar.online` rewrites this file in place,
# adding `listen 443 ssl`, the certificate lines and the port 80 redirect around these locations.
# nginx refuses a `listen ... ssl` block without a certificate, so shipping one would deadlock the
# first issuance.
#
# Everything goes to the one web process: it serves the client under /app, the API on its own
# paths and the Socket.IO gateway. The worker, the database and the rest of the stack publish
# nothing this file reaches.
#
# Two ways in, and nothing else is answered:
#   The owner: basic auth at /gate/owner, the one place that sets the owner gate cookie, so no guest
#   can obtain it. A request with that cookie passes at once.
#   A guest: an invite link under /invite/ sets the tbn_guest cookie; every request with it is
#   checked with the web process through auth_request, so a revoked guest is shut out.
# A request with neither is sent to /gate/owner, where the browser asks for the password.
#
# The gate token and the password file live only on the host, never in this public repository:
#   /etc/nginx/tbn_game_gate.conf    maps $cookie_tbn_gate to $tbn_gate_realm ("off" for the right
#                                    token) and defines $tbn_gate_token; the token is 32 hex
#                                    characters, since a longer map key overflows nginx's default
#                                    map_hash_bucket_size and fails `nginx -t`
#   /etc/nginx/tbn_game.htpasswd     the username and its apr1 password hash
# ponytail: one shared owner gate token; rotate it by rewriting the gate file.

include /etc/nginx/tbn_game_gate.conf;

# Invite links are guessed at no faster than this from one address.
limit_req_zone $binary_remote_addr zone=tbn_game_invite:1m rate=10r/m;

upstream tbn_game_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

# Socket.IO upgrades to a WebSocket; every other request keeps the upstream connection alive.
map $http_upgrade $tbn_game_connection {
    default upgrade;
    ''      '';
}

server {
    server_name tbn-game.filhmar.online;

    # The web process accepts 1 MB bodies (HTTP_BODY_LIMIT_BYTES); this leaves room for headers.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $tbn_game_connection;

    # The ACME http-01 challenge passes without credentials, for the first certificate and every
    # renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The web process's Prometheus metrics are for the stack's own Prometheus, never the internet.
    location = /metrics {
        return 404;
    }

    # The owner signs in here with the password; a good one sets the owner gate cookie. The answer
    # must come from the content phase, after auth_basic: a `return` runs in the rewrite phase,
    # before any password check, and would hand the cookie to anyone. The web process answers `/`
    # with its redirect to the world.
    location = /gate/owner {
        auth_basic "tbn game";
        auth_basic_user_file /etc/nginx/tbn_game.htpasswd;
        add_header Set-Cookie "tbn_gate=$tbn_gate_token; Path=/; Max-Age=604800; Secure; HttpOnly; SameSite=Strict";
        proxy_pass http://tbn_game_web/;
    }

    # A friend's invite link. The web process answers it once and sets the guest cookie.
    location ^~ /invite/ {
        limit_req zone=tbn_game_invite burst=10 nodelay;
        proxy_pass http://tbn_game_web;
    }

    location / {
        auth_request /_tbn_game_gate;
        error_page 401 = @tbn_game_sign_in;
        proxy_pass http://tbn_game_web;
    }

    # The owner gate cookie passes here; anything else is the web process's to judge.
    location = /_tbn_game_gate {
        internal;
        if ($tbn_gate_realm = off) {
            return 204;
        }
        proxy_pass http://tbn_game_web/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @tbn_game_sign_in {
        return 302 /gate/owner;
    }
}
