# Keeps pinned versions and digests fresh. Updates arrive grouped, once a month per ecosystem, as
# pull requests that go through every CI gate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ['*']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      docker-compose:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
