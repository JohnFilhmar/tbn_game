# Production deploy. Runs only when the owner dispatches it from main, only after the `production`
# environment approves it, and only on the self-hosted runner on the server. It deploys the exact
# digest that CI built and signed on main and refuses anything else. docs/server_setup.md sets up
# the runner, its job guard and the environment protection.
name: deploy

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Digest of the backend image that CI signed on main, as sha256:<64 hex>
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, tbn-production]
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      SIGNER: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
      SECRETS_FILE: deploy/secrets/production.enc.env
      # The stack runs from this directory, so it does not depend on the runner's checkout.
      STACK_DIR: /opt/tbn
      COMPOSE_FILE: /opt/tbn/docker-compose.production.yml
    steps:
      - name: Check the digest format
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image_digest must look like sha256:<64 lowercase hex characters>"
            exit 1
          fi
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend@$IMAGE_DIGEST" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the signature and the SBOM attestation from CI on main
        run: |
          cosign verify --certificate-identity "$SIGNER" --certificate-oidc-issuer "$ISSUER" \
            "$BACKEND_IMAGE" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$ISSUER" "$BACKEND_IMAGE" > /dev/null
      - name: Pull the verified image
        run: docker pull "$BACKEND_IMAGE"
      - name: Decrypt the secrets
        run: |
          if [[ ! -f "$SECRETS_FILE" ]]; then
            echo "::error::$SECRETS_FILE is missing. docs/server_setup.md explains how to create it."
            exit 1
          fi
          umask 077
          sops --decrypt --input-type dotenv --output-type dotenv "$SECRETS_FILE" \
            > "$RUNNER_TEMP/production.env"
      - name: Stage the stack files
        run: |
          install -d -m 0755 "$STACK_DIR" "$STACK_DIR/deploy" "$STACK_DIR/deploy/searxng"
          install -m 0644 docker-compose.production.yml "$STACK_DIR/docker-compose.production.yml"
          install -m 0644 deploy/searxng/settings.yml "$STACK_DIR/deploy/searxng/settings.yml"
      - name: Start the database
        run: docker compose --env-file "$RUNNER_TEMP/production.env" up --detach --wait postgres
      - name: Release step, apply database migrations
        run: >-
          docker compose --env-file "$RUNNER_TEMP/production.env"
          run --rm --no-deps web /app/node_modules/prisma/build/index.js migrate deploy
      - name: Start the stack
        run: >-
          docker compose --env-file "$RUNNER_TEMP/production.env"
          up --detach --wait --wait-timeout 300 --remove-orphans
      - name: Check that the running version is the verified one
        run: |
          expected=$(docker image inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$BACKEND_IMAGE")
          address=$(docker compose --env-file "$RUNNER_TEMP/production.env" port web 3000)
          body=$(curl -fsS --max-time 5 "http://$address/health")
          if ! jq -e --arg sha "$expected" '.status == "ok" and .commit_sha == $sha' <<<"$body" > /dev/null; then
            echo "::error::Unexpected health after deploy: $body"
            exit 1
          fi
          echo "Deployed $BACKEND_IMAGE (commit $expected)" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the decrypted secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/production.env"
