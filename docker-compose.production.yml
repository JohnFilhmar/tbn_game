# Production stack on the private server. The deploy workflow runs it; see docs/server_setup.md.
# Same services, networks, healthchecks and limits as docker-compose.development.yml.
#
# Values come from the SOPS-encrypted environment file the deploy job decrypts, plus
# BACKEND_IMAGE, which the deploy job sets to the signed digest it verified. Required values fail
# fast when missing. The web port and Grafana's are published on 127.0.0.1 for `tailscale serve`,
# and the ops ports of the launcher and the proxy on 127.0.0.1 for their health checks.
name: tbn

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs:
    - /tmp:size=64m

# Web and worker share one image and one environment.
x-backend: &backend
  <<: *hardening
  image: ${BACKEND_IMAGE:?set by the deploy workflow to the verified image digest}
  init: true
  restart: unless-stopped
  logging: *logging
  environment: &backend_environment
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgresql://tbn:${POSTGRES_PASSWORD:?missing from the secrets file}@postgres:5432/tbn
    DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?missing from the secrets file}
    SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
    WEB_PORT: '3000'
    WORKER_PORT: '3001'
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    WORKSPACE_DIR: /workspace
    PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-300000}
    PROVIDER_BREAKER_THRESHOLD: ${PROVIDER_BREAKER_THRESHOLD:-3}
    PROVIDER_BREAKER_COOLDOWN_SECONDS: ${PROVIDER_BREAKER_COOLDOWN_SECONDS:-60}
    EGRESS_PROXY_URL: http://egress_proxy:3128
    SEARXNG_URL: http://searxng:8080
    EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-0}
    COMMAND_RETENTION_HOURS: ${COMMAND_RETENTION_HOURS:-0}
  depends_on:
    postgres:
      condition: service_healthy
  networks: [backend]

services:
  web:
    <<: *backend
    command: ['dist/web.js']
    volumes:
      - workspace:/workspace
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js', 'web']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '${WEB_CPUS:-1.0}'
          memory: ${WEB_MEMORY:-512M}
          pids: 256

  worker:
    <<: *backend
    command: ['dist/worker.js']
    volumes:
      - workspace:/workspace
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js', 'worker']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${WORKER_CPUS:-2.0}'
          memory: ${WORKER_MEMORY:-1G}
          pids: 512

  postgres:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    logging: *logging
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_USER: tbn
      POSTGRES_DB: tbn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing from the secrets file}
    volumes:
      - postgres_data:/var/lib/postgresql
    shm_size: 256m
    networks: [backend]
    healthcheck:
      test: ['CMD', 'pg_isready', '--username=tbn', '--dbname=tbn']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 1s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPUS:-2.0}'
          memory: ${POSTGRES_MEMORY:-2G}

  # The sandbox launcher: the one container holding the docker socket. It takes sandbox jobs from
  # the queue and runs each in a fresh hardened container from the sandbox image, on the internal
  # sandbox network. It listens on nothing but its ops port.
  sandbox:
    <<: *backend
    command: ['dist/sandbox.js']
    user: '65532:65532'
    # The host's docker group, so the socket is writable. Set DOCKER_GID to its id on this host.
    group_add:
      - '${DOCKER_GID:-999}'
    environment:
      <<: *backend_environment
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:?set by the deploy workflow to the verified sandbox image digest}
      SANDBOX_NETWORK: tbn_sandbox
      WORKSPACE_VOLUME: tbn_workspace
      SANDBOX_MAX_PARALLEL: ${SANDBOX_MAX_PARALLEL:-2}
      SANDBOX_MAX_CPUS: ${SANDBOX_MAX_CPUS:-2}
      SANDBOX_MAX_MEMORY_MB: ${SANDBOX_MAX_MEMORY_MB:-2048}
      SANDBOX_MAX_SCRATCH_MB: ${SANDBOX_MAX_SCRATCH_MB:-1024}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '127.0.0.1:3002:3002'
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js', 'sandbox']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 128

  # The forward proxy, the only exit of the sandbox network and of the worker's fetch tool. It
  # holds no database URL and no key, and refuses every private destination.
  egress_proxy:
    <<: *hardening
    image: ${BACKEND_IMAGE:?set by the deploy workflow to the verified image digest}
    command: ['dist/egress_proxy.js']
    init: true
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EGRESS_PROXY_PORT: '3128'
      EGRESS_PROXY_OPS_PORT: '3003'
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-}
      EGRESS_MAX_RESPONSE_BYTES: ${EGRESS_MAX_RESPONSE_BYTES:-10485760}
      EGRESS_MAX_REQUESTS_PER_MINUTE: ${EGRESS_MAX_REQUESTS_PER_MINUTE:-120}
    ports:
      - '127.0.0.1:3003:3003'
    networks: [backend, sandbox]
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js', 'egress_proxy']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
          pids: 256

  searxng:
    <<: *hardening
    image: searxng/searxng:2026.9.30-a9d990033@sha256:a07a5cd2da2c63d66e559f9e4d3a3db106cfc6c32fb0ac70abe91cc28bcd7350
    user: '977:977'
    restart: unless-stopped
    logging: *logging
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?missing from the secrets file}
      GRANIAN_HOST: 0.0.0.0
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    networks: [backend]
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          '--header',
          'X-Real-IP: 127.0.0.1',
          'http://127.0.0.1:8080/healthz',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 256

  # Prometheus scrapes the four backend processes on the backend network and keeps 30 days. It
  # publishes no port; Grafana reads it.
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.listen-address=:9090
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 128

  # Grafana shows the dashboards provisioned from deploy/grafana, read from Prometheus. Only the
  # admin account signs in; alerting stays off, as alerts reach the owner through the
  # notification channels.
  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?missing from the secrets file}
      # tailscale serve gives Grafana HTTPS, so its cookie is sent over HTTPS only.
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_UNIFIED_ALERTING_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/tbn/dashboards/tbn.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/tbn/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3005:3000'
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 256

networks:
  backend: {}
  # Internal and isolated from the host: sandbox containers on it reach only the proxy, never the
  # host, the app, the database or the internet. Internal alone leaves the host's own address on
  # the bridge reachable; the isolated gateway mode (Docker 28 or newer) removes it. The launcher
  # creates sandbox containers on this network by name.
  sandbox:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  postgres_data: {}
  workspace: {}
  searxng_cache: {}
  prometheus_data: {}
  grafana_data: {}
