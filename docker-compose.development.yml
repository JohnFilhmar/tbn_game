# Development stack. One command brings it up healthy:
#   docker compose -f docker-compose.development.yml up --build --wait
# Same services, networks, healthchecks and limits as docker-compose.production.yml. The values in
# this file are for development only. Every published port binds to 127.0.0.1 because Docker
# bypasses host firewall rules for published ports.
name: tbn_development

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs:
    - /tmp:size=64m

# Web and worker share one image and one environment.
x-backend: &backend
  <<: *hardening
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
  image: tbn/backend:development
  init: true
  restart: unless-stopped
  logging: *logging
  environment: &backend_environment
    NODE_ENV: development
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgresql://tbn:${POSTGRES_PASSWORD:-tbn_development_only}@postgres:5432/tbn
    # Development only. Production reads the key from the SOPS-encrypted secrets file.
    SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-ZGV2ZWxvcG1lbnQtb25seS1rZXktZG8tbm90LXVzZSE=}
    WEB_PORT: '3000'
    WORKER_PORT: '3001'
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    WORKSPACE_DIR: /workspace
    PROVIDER_BREAKER_THRESHOLD: ${PROVIDER_BREAKER_THRESHOLD:-3}
    PROVIDER_BREAKER_COOLDOWN_SECONDS: ${PROVIDER_BREAKER_COOLDOWN_SECONDS:-60}
    EGRESS_PROXY_URL: http://egress_proxy:3128
    SEARXNG_URL: http://searxng:8080
    EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-0}
    COMMAND_RETENTION_HOURS: ${COMMAND_RETENTION_HOURS:-0}
  depends_on:
    postgres:
      condition: service_healthy
  networks: [backend]

services:
  web:
    <<: *backend
    command: ['dist/web.js']
    volumes:
      - workspace:/workspace
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js', 'web']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 256

  worker:
    <<: *backend
    command: ['dist/worker.js']
    # A local model on the host, such as Ollama, is reached as host.docker.internal.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - workspace:/workspace
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js', 'worker']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
          pids: 512

  postgres:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    logging: *logging
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_USER: tbn
      POSTGRES_DB: tbn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbn_development_only}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    shm_size: 128m
    networks: [backend]
    healthcheck:
      test: ['CMD', 'pg_isready', '--username=tbn', '--dbname=tbn']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  # The sandbox launcher: the one container holding the docker socket. It takes sandbox jobs from
  # the queue and runs each in a fresh hardened container from the sandbox image, on the internal
  # sandbox network. It listens on nothing but its ops port.
  sandbox:
    <<: *backend
    command: ['dist/sandbox.js']
    user: '65532:65532'
    # The host's docker group, so the socket is writable. Set DOCKER_GID to its id on this host.
    group_add:
      - '${DOCKER_GID:-999}'
    environment:
      <<: *backend_environment
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-tbn/sandbox:development}
      SANDBOX_NETWORK: tbn_development_sandbox
      WORKSPACE_VOLUME: tbn_development_workspace
      SANDBOX_MAX_PARALLEL: ${SANDBOX_MAX_PARALLEL:-2}
      SANDBOX_MAX_CPUS: ${SANDBOX_MAX_CPUS:-2}
      SANDBOX_MAX_MEMORY_MB: ${SANDBOX_MAX_MEMORY_MB:-2048}
      SANDBOX_MAX_SCRATCH_MB: ${SANDBOX_MAX_SCRATCH_MB:-1024}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - '127.0.0.1:3002:3002'
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js', 'sandbox']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 128

  # The forward proxy, the only exit of the sandbox network and of the worker's fetch tool. It
  # holds no database URL and no key, and refuses every private destination.
  egress_proxy:
    <<: *hardening
    image: tbn/backend:development
    command: ['dist/egress_proxy.js']
    init: true
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EGRESS_PROXY_PORT: '3128'
      EGRESS_PROXY_OPS_PORT: '3003'
      EGRESS_ALLOWED_HOSTS: ${EGRESS_ALLOWED_HOSTS:-}
      EGRESS_MAX_RESPONSE_BYTES: ${EGRESS_MAX_RESPONSE_BYTES:-10485760}
      EGRESS_MAX_REQUESTS_PER_MINUTE: ${EGRESS_MAX_REQUESTS_PER_MINUTE:-120}
    ports:
      - '127.0.0.1:3003:3003'
    networks: [backend, sandbox]
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js', 'egress_proxy']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
          pids: 256

  searxng:
    <<: *hardening
    image: searxng/searxng:2026.9.30-a9d990033@sha256:a07a5cd2da2c63d66e559f9e4d3a3db106cfc6c32fb0ac70abe91cc28bcd7350
    user: '977:977'
    restart: unless-stopped
    logging: *logging
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-searxng_development_only}
      GRANIAN_HOST: 0.0.0.0
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    networks: [backend]
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          '--header',
          'X-Real-IP: 127.0.0.1',
          'http://127.0.0.1:8080/healthz',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 256

  # Prometheus scrapes the four backend processes on the backend network and keeps 30 days. It
  # publishes no port; Grafana reads it.
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.listen-address=:9090
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 128

  # Grafana shows the dashboards provisioned from deploy/grafana, read from Prometheus. Only the
  # admin account signs in; alerting stays off, as alerts reach the owner through the
  # notification channels.
  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_development_only}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_UNIFIED_ALERTING_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/tbn/dashboards/tbn.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/tbn/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3005:3000'
    networks: [backend]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 256

networks:
  backend: {}
  # Internal and isolated from the host: sandbox containers on it reach only the proxy, never the
  # host, the app, the database or the internet. Internal alone leaves the host's own address on
  # the bridge reachable; the isolated gateway mode (Docker 28 or newer) removes it. The launcher
  # creates sandbox containers on this network by name.
  sandbox:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  postgres_data: {}
  workspace: {}
  searxng_cache: {}
  prometheus_data: {}
  grafana_data: {}
